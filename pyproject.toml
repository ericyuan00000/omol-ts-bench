[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "omol-ts-bench"
version = "0.1.0"
description = "Benchmark suite for transition state optimization methods on organometallic reactions from the OMol dataset"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Eric Yuan"},
]
dependencies = [
    "ase>=3.23",
    "numpy",
    "pyyaml",
    "openbabel>=3.2.0",
]

[project.optional-dependencies]
uma = [
    "fairchem-core",
]
sella = [
    "sella",
]
pygsm = [
    # pyGSM must be installed from source: https://github.com/ZimmermanGroup/pyGSM
    # pip install git+https://github.com/ZimmermanGroup/pyGSM.git
]
quacc = [
    "quacc",
]
dev = [
    "pytest",
    "pytest-cov",
]
all = [
    "omol-ts-bench[uma,sella,pygsm,dev]",
]

[project.scripts]
omol-ts-bench = "omol_ts_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
